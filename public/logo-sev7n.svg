<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Clip to octagon shape -->
    <clipPath id="octClip">
      <polygon points="66,8 154,8 212,66 212,154 154,212 66,212 8,154 8,66"/>
    </clipPath>
  </defs>

  <!-- Background octagon -->
  <polygon points="66,8 154,8 212,66 212,154 154,212 66,212 8,154 8,66" fill="#0d0d0d"/>

  <!-- Stylized 7 -->
  <g clip-path="url(#octClip)">
    <!-- Top horizontal bar of 7 -->
    <polygon points="58,38 162,38 162,52 112,52 112,38" fill="white"/>
    <!-- Diagonal stem going down-right -->
    <polygon points="112,52 162,52 108,148 88,148" fill="white"/>
    <!-- Diagonal slash line across the 7 (the distinctive cut) -->
    <polygon points="58,80 168,58 168,65 58,87" fill="#0d0d0d"/>
  </g>

  <!-- SEV7N text -->
  <text
    x="110"
    y="180"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="30"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="1"
  >SEV7N</text>

  <!-- TEAM text -->
  <text
    x="110"
    y="200"
    font-family="'Arial', sans-serif"
    font-size="13"
    font-weight="600"
    fill="white"
    text-anchor="middle"
    letter-spacing="6"
  >TEAM</text>
</svg>
